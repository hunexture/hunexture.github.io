<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Descent Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }
        
        /* Layout */
        .viz-split { display: flex; flex: 1; height: 60%; position: relative; }
        #view-3d { flex: 2; position: relative; background: #000; overflow: hidden; }
        #view-2d { flex: 1; position: relative; background: #1e293b; border-left: 1px solid #334155; }
        
        /* Controls */
        #controls {
            height: auto;
            min-height: 220px;
            background: #1e293b;
            padding: 15px;
            border-top: 1px solid #334155;
            z-index: 10;
        }

        .control-panel { display: flex; flex-direction: column; gap: 10px; }
        .slider-group { margin-bottom: 8px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #3b82f6; }
        
        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #334155; }
        
        /* Labels */
        h1 { font-size: 1.25rem; font-weight: bold; color: #60a5fa; margin: 0 0 5px 0; }
        h2 { font-size: 1rem; font-weight: 600; color: #e2e8f0; margin: 10px 0 5px 0; border-bottom: 1px solid #334155; padding-bottom: 2px; }
        p { color: #94a3b8; font-size: 0.85rem; margin: 0 0 10px 0; }
        
        .stat-box { background: #334155; padding: 8px; border-radius: 8px; text-align: center; min-width: 80px; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .stat-label { font-size: 0.75rem; color: #cbd5e1; }

        /* Overlays */
        canvas { display: block; width: 100%; height: 100%; }
        .view-label {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px;
            font-size: 0.8rem; pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <div class="viz-split">
        <div id="view-3d">
            <div class="view-label">3D Loss Landscape (Gradient Descent)</div>
        </div>
        <div id="view-2d">
            <div class="view-label">2D Data Fit</div>
            <canvas id="canvas-2d"></canvas>
        </div>
    </div>

    <div id="controls" class="flex flex-col md:flex-row gap-6">
        
        <!-- Manual Controls -->
        <div class="flex-1 control-panel">
            <h1>1. Manual Exploration</h1>
            <p>Move the sliders to position the walker.</p>
            
            <div class="slider-group">
                <div class="flex justify-between text-sm">
                    <label>Weight (w): <span id="val-w" class="text-blue-400">0.00</span></label>
                </div>
                <input type="range" id="input-w" min="-1" max="5" step="0.1" value="0">
            </div>

            <div class="slider-group">
                <div class="flex justify-between text-sm">
                    <label>Bias (b): <span id="val-b" class="text-green-400">0.00</span></label>
                </div>
                <input type="range" id="input-b" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>

        <!-- Gradient Descent Controls -->
        <div class="flex-1 control-panel border-l border-slate-700 pl-6">
            <h1>2. Gradient Descent (The Walker)</h1>
            <p>Let math find the bottom of the valley automatically.</p>
            
            <div class="slider-group">
                <div class="flex justify-between text-sm">
                    <label>Learning Rate (Step Size): <span id="val-lr" class="text-yellow-400">0.01</span></label>
                </div>
                <input type="range" id="input-lr" min="0.001" max="0.2" step="0.001" value="0.01">
            </div>

            <div class="flex gap-2 mt-2">
                <button id="btn-start" class="btn btn-primary flex-1">Start Descent</button>
                <button id="btn-stop" class="btn btn-danger flex-1 hidden">Stop</button>
                <button id="btn-reset" class="btn btn-secondary">Reset</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="flex flex-col justify-center gap-3 min-w-[150px]">
            <div class="stat-box border border-red-500/30">
                <div class="stat-value text-red-400" id="val-loss">0.00</div>
                <div class="stat-label">MSE (Loss)</div>
            </div>
            <div class="stat-box border border-purple-500/30">
                <div class="stat-value text-purple-400" id="val-epoch">0</div>
                <div class="stat-label">Steps Taken</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Configuration ---
    // Dataset: y = 2x + 1 (plus some noise)
    const dataPoints = [
        { x: -1, y: -0.8 }, 
        { x: 0, y: 1.2 },
        { x: 1, y: 3.1 },
        { x: 2, y: 4.8 },
        { x: 3, y: 7.2 }
    ];

    // State
    const state = {
        w: 0,
        b: 0,
        loss: 0,
        lr: 0.01,
        isDescending: false,
        steps: 0,
        history: [] // Array of {w, b, loss} for tracing the path
    };

    // --- 3D Scene Setup ---
    const container3D = document.getElementById('view-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0f172a'); 
    scene.fog = new THREE.Fog('#0f172a', 10, 60);

    const camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
    camera.position.set(10, 14, 14);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    container3D.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Helpers
    const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    scene.add(gridHelper);

    // Text Sprites for Labels
    function makeTextSprite(message, x, y, z) {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        context.font = "Bold 24px Arial";
        const metrics = context.measureText(message);
        const textWidth = metrics.width;
        
        context.fillStyle = "rgba(0,0,0,0)";
        context.strokeStyle = "rgba(0,0,0,0)";
        
        context.fillStyle = "rgba(255, 255, 255, 1.0)";
        context.fillText(message, 0, 24);
        
        const texture = new THREE.Texture(canvas); 
        texture.needsUpdate = true; 
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(4, 2, 1);
        sprite.position.set(x, y, z);
        return sprite;  
    }

    scene.add(makeTextSprite("Weight (w)", 8, 0, 0));
    scene.add(makeTextSprite("Bias (b)", 0, 0, 8));
    scene.add(makeTextSprite("Loss", 0, 8, 0));

    // --- Loss Surface (The Mountain) ---
    // We visualize range w:[-1, 5], b:[-5, 5]
    const wMin = -1, wMax = 5;
    const bMin = -5, bMax = 5;
    
    function calculateMSE(w, b) {
        let sumErrorSq = 0;
        for(let p of dataPoints) {
            const yPred = w * p.x + b;
            const error = p.y - yPred;
            sumErrorSq += error * error;
        }
        return sumErrorSq / dataPoints.length;
    }

    const geometry = new THREE.PlaneGeometry(wMax - wMin, bMax - bMin, 50, 50);
    const count = geometry.attributes.position.count;
    const colors = [];
    const colorObject = new THREE.Color();

    for (let i = 0; i < count; i++) {
        const lx = geometry.attributes.position.getX(i);
        const ly = geometry.attributes.position.getY(i);

        // Map local plane coords to world w, b
        const wVal = lx + (wMax + wMin) / 2;
        const bVal = ly + (bMax + bMin) / 2;

        const loss = calculateMSE(wVal, bVal);
        
        // Set Z (height) based on loss
        const displayHeight = Math.min(loss, 15); // Clamp for visuals
        geometry.attributes.position.setZ(i, displayHeight);

        // Color Gradient (Blue=Low, Red=High)
        const t = Math.min(loss / 25, 1); 
        colorObject.setHSL(0.66 - (t * 0.66), 1.0, 0.5);
        colors.push(colorObject.r, colorObject.g, colorObject.b);
    }

    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const surface = new THREE.Mesh(
        geometry, 
        new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.4 })
    );
    surface.rotation.x = -Math.PI / 2;
    surface.position.x = (wMax + wMin) / 2;
    surface.position.z = (bMax + bMin) / 2;
    scene.add(surface);

    // Wireframe for the surface
    const wireframe = new THREE.LineSegments(
        new THREE.WireframeGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05 })
    );
    wireframe.rotation.x = -Math.PI / 2;
    wireframe.position.copy(surface.position);
    scene.add(wireframe);

    // --- The Walker (Marker) ---
    const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 32, 32),
        new THREE.MeshPhongMaterial({ color: 0xffea00, emissive: 0xff0000, emissiveIntensity: 0.2 })
    );
    scene.add(marker);

    // The Path Trail (Gradient Descent History)
    const MAX_PATH_POINTS = 1000;
    const pathGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(MAX_PATH_POINTS * 3);
    pathGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pathGeometry.setDrawRange(0, 0);
    const pathLine = new THREE.Line(
        pathGeometry,
        new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 })
    );
    scene.add(pathLine);

    // --- 2D Canvas Setup ---
    const canvas2D = document.getElementById('canvas-2d');
    const ctx2D = canvas2D.getContext('2d');

    function resize2D() {
        canvas2D.width = canvas2D.parentElement.clientWidth;
        canvas2D.height = canvas2D.parentElement.clientHeight;
        draw2D();
    }
    window.addEventListener('resize', () => {
        resize2D();
        camera.aspect = container3D.clientWidth / container3D.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    });

    function toScreen(x, y, width, height) {
        const minX = -2, maxX = 4;
        const minY = -2, maxY = 8;
        const sx = ((x - minX) / (maxX - minX)) * width;
        const sy = height - ((y - minY) / (maxY - minY)) * height;
        return {x: sx, y: sy};
    }

    function draw2D() {
        const w = canvas2D.width;
        const h = canvas2D.height;
        ctx2D.clearRect(0, 0, w, h);

        // Axes
        const origin = toScreen(0, 0, w, h);
        ctx2D.strokeStyle = '#475569';
        ctx2D.lineWidth = 2;
        ctx2D.beginPath(); ctx2D.moveTo(0, origin.y); ctx2D.lineTo(w, origin.y); ctx2D.stroke();
        ctx2D.beginPath(); ctx2D.moveTo(origin.x, 0); ctx2D.lineTo(origin.x, h); ctx2D.stroke();

        // Data Points
        dataPoints.forEach(p => {
            const pos = toScreen(p.x, p.y, w, h);
            ctx2D.fillStyle = '#60a5fa';
            ctx2D.beginPath(); ctx2D.arc(pos.x, pos.y, 6, 0, Math.PI * 2); ctx2D.fill();
        });

        // Regression Line
        const startX = -2, endX = 4;
        const startY = state.w * startX + state.b;
        const endY = state.w * endX + state.b;
        const p1 = toScreen(startX, startY, w, h);
        const p2 = toScreen(endX, endY, w, h);

        ctx2D.strokeStyle = '#facc15';
        ctx2D.lineWidth = 3;
        ctx2D.beginPath(); ctx2D.moveTo(p1.x, p1.y); ctx2D.lineTo(p2.x, p2.y); ctx2D.stroke();

        // Residuals
        ctx2D.strokeStyle = '#f87171';
        ctx2D.lineWidth = 1;
        ctx2D.setLineDash([5, 5]);
        dataPoints.forEach(p => {
            const predictedY = state.w * p.x + state.b;
            const actualPos = toScreen(p.x, p.y, w, h);
            const predictedPos = toScreen(p.x, predictedY, w, h);
            ctx2D.beginPath(); ctx2D.moveTo(actualPos.x, actualPos.y); ctx2D.lineTo(predictedPos.x, predictedPos.y); ctx2D.stroke();
        });
        ctx2D.setLineDash([]);
    }

    // --- Core Logic ---

    function updateVisuals() {
        // UI Text
        document.getElementById('val-w').textContent = state.w.toFixed(3);
        document.getElementById('val-b').textContent = state.b.toFixed(3);
        document.getElementById('val-loss').textContent = state.loss.toFixed(3);
        document.getElementById('val-epoch').textContent = state.steps;

        // Sliders (sync if automated)
        document.getElementById('input-w').value = state.w;
        document.getElementById('input-b').value = state.b;

        // 3D Marker
        marker.position.set(state.w, state.loss, state.b);

        // Path Trace
        const positions = pathLine.geometry.attributes.position.array;
        // Rebuild line from history
        for(let i=0; i < state.history.length && i < MAX_PATH_POINTS; i++) {
            positions[i*3] = state.history[i].w;
            positions[i*3+1] = state.history[i].loss + 0.05; // Lift slightly above surface
            positions[i*3+2] = state.history[i].b;
        }
        pathLine.geometry.setDrawRange(0, state.history.length);
        pathLine.geometry.attributes.position.needsUpdate = true;

        draw2D();
    }

    function calculateGradients(w, b) {
        // Partial Derivative of MSE w.r.t w:  -2/N * sum(x * (y - y_pred))
        // Partial Derivative of MSE w.r.t b:  -2/N * sum(y - y_pred)
        let dw = 0;
        let db = 0;
        const N = dataPoints.length;

        for(let p of dataPoints) {
            const yPred = w * p.x + b;
            const error = p.y - yPred; // Actual - Predicted
            
            // Using chain rule derived formula:
            // d(error^2)/dw = 2 * error * d(error)/dw
            // d(error)/dw = -x
            // So: -2 * error * x
            
            dw += -2 * error * p.x;
            db += -2 * error; // d(error)/db = -1
        }
        
        return { dw: dw / N, db: db / N };
    }

    function stepGradientDescent() {
        if (!state.isDescending) return;

        const grads = calculateGradients(state.w, state.b);
        
        // Update rules: New = Old - (LearningRate * Gradient)
        state.w = state.w - (state.lr * grads.dw);
        state.b = state.b - (state.lr * grads.db);
        
        // Recalculate loss for new position
        state.loss = calculateMSE(state.w, state.b);
        state.steps++;

        // Add to history for the trail
        state.history.push({ w: state.w, b: state.b, loss: state.loss });
        
        // Auto-stop if converged (gradient very small) or too many steps
        if (Math.abs(grads.dw) < 0.001 && Math.abs(grads.db) < 0.001) {
             stopDescent();
             console.log("Converged!");
        }

        updateVisuals();
        
        // Slow down the loop slightly for visualization purposes
        // requestAnimationFrame is too fast, let's use setTimeout inside the recursive call
        if(state.isDescending) {
            setTimeout(() => requestAnimationFrame(stepGradientDescent), 50); // 20fps-ish
        }
    }

    function startDescent() {
        if (state.isDescending) return;
        state.isDescending = true;
        document.getElementById('btn-start').classList.add('hidden');
        document.getElementById('btn-stop').classList.remove('hidden');
        
        // Start loop
        stepGradientDescent();
    }

    function stopDescent() {
        state.isDescending = false;
        document.getElementById('btn-start').classList.remove('hidden');
        document.getElementById('btn-stop').classList.add('hidden');
    }

    function reset() {
        stopDescent();
        // Reset to a random high-error position
        state.w = -1; // Specific point to show travel
        state.b = 4;
        state.loss = calculateMSE(state.w, state.b);
        state.steps = 0;
        state.history = [{w: state.w, b: state.b, loss: state.loss}];
        updateVisuals();
    }

    // --- Input Handlers ---
    
    // Slider Inputs
    const inputW = document.getElementById('input-w');
    const inputB = document.getElementById('input-b');
    const inputLR = document.getElementById('input-lr');

    function onManualChange() {
        if (state.isDescending) stopDescent();
        state.w = parseFloat(inputW.value);
        state.b = parseFloat(inputB.value);
        state.loss = calculateMSE(state.w, state.b);
        
        // Clear history on manual move so we don't draw weird lines
        state.history = [{w: state.w, b: state.b, loss: state.loss}];
        state.steps = 0;
        updateVisuals();
    }

    inputW.addEventListener('input', onManualChange);
    inputB.addEventListener('input', onManualChange);
    
    inputLR.addEventListener('input', (e) => {
        state.lr = parseFloat(e.target.value);
        document.getElementById('val-lr').textContent = state.lr.toFixed(3);
    });

    // Buttons
    document.getElementById('btn-start').addEventListener('click', startDescent);
    document.getElementById('btn-stop').addEventListener('click', stopDescent);
    document.getElementById('btn-reset').addEventListener('click', reset);

    // Initial Setup
    reset();
    resize2D();

    // Render Loop
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

</script>
</body>
</html>
