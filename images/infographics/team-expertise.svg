<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@500&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .center-label { font-family: 'Orbitron', sans-serif; font-size: 14px; fill: #00d4ff; font-weight: 700; text-anchor: middle; }
    .axis-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8892b0; font-weight: 500; text-anchor: middle; }
    .grid-line { stroke: #1e3a5f; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
    .axis-line { stroke: #1e3a5f; stroke-width: 1; fill: none; }
    .radar-area { fill: url(#radarGrad); stroke: #00d4ff; stroke-width: 2; opacity: 0.8; }
    .data-point { fill: #ffffff; stroke: #00d4ff; stroke-width: 2; filter: drop-shadow(0 0 5px #00d4ff); }
  </style>

  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="520" height="520" fill="#0a1628"/>
  <text x="260" y="40" class="title">Full-Stack Capability</text>

  <g transform="translate(260, 280)">
    
    <!-- Coordinate system for hexagons: 
         Points at angles: -90, -30, 30, 90, 150, 210 degrees
         Rings at radius 50, 100, 150
    -->

    <!-- Ring 1 (R=50) -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" class="grid-line"/>
    <!-- Ring 2 (R=100) -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" class="grid-line"/>
    <!-- Ring 3 (Outer R=150) -->
    <polygon points="0,-150 129.9,-75 129.9,75 0,150 -129.9,75 -129.9,-75" class="grid-line" style="stroke-dasharray:none;"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-150" class="axis-line"/>
    <line x1="0" y1="0" x2="129.9" y2="-75" class="axis-line"/>
    <line x1="0" y1="0" x2="129.9" y2="75" class="axis-line"/>
    <line x1="0" y1="0" x2="0" y2="150" class="axis-line"/>
    <line x1="0" y1="0" x2="-129.9" y2="75" class="axis-line"/>
    <line x1="0" y1="0" x2="-129.9" y2="-75" class="axis-line"/>

    <!-- Data Polygon 
         Values (out of max 150):
         Top (AI): 140
         Top-Right (Web): 150
         Bottom-Right (Mobile): 135
         Bottom (Cloud): 145
         Bottom-Left (UI/UX): 130
         Top-Left (System): 140
    -->
    <polygon points="
      0,-140 
      129.9,-75 
      116.9,67.5 
      0,145 
      -112.5,65 
      -121.2,-70
    " class="radar-area"/>

    <!-- Data Points -->
    <circle cx="0" cy="-140" r="4" class="data-point"/>
    <circle cx="129.9" cy="-75" r="4" class="data-point"/>
    <circle cx="116.9" cy="67.5" r="4" class="data-point"/>
    <circle cx="0" cy="145" r="4" class="data-point"/>
    <circle cx="-112.5" cy="65" r="4" class="data-point"/>
    <circle cx="-121.2" cy="-70" r="4" class="data-point"/>

    <!-- Axis Labels -->
    <text x="0" y="-170" class="axis-label" fill="#00d4ff">AI &amp; Machine Learning</text>
    <text x="145" y="-85" class="axis-label" style="text-anchor:start;">Web Development</text>
    <text x="145" y="85" class="axis-label" style="text-anchor:start;">Mobile Apps</text>
    <text x="0" y="175" class="axis-label">Cloud Architecture</text>
    <text x="-145" y="85" class="axis-label" style="text-anchor:end;">UI/UX Design</text>
    <text x="-145" y="-85" class="axis-label" style="text-anchor:end;">System Integration</text>

    <!-- Center text -->
    <circle cx="0" cy="0" r="25" fill="#112240" stroke="#00d4ff" stroke-width="1"/>
    <text x="0" y="-3" class="center-label" font-size="10">Our</text>
    <text x="0" y="10" class="center-label" font-size="10">Expertise</text>
    
  </g>
</svg>
