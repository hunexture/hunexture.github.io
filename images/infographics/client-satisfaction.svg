<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Inter:wght@500;600&amp;display=swap');
    .title { font-family: 'Inter', sans-serif; font-size: 18px; fill: #8892b0; font-weight: 500; text-anchor: middle; }
    .note { font-family: 'Inter', sans-serif; font-size: 13px; fill: #666; font-weight: 500; text-anchor: middle; }
    .number { font-family: 'Orbitron', sans-serif; font-size: 72px; fill: #ffffff; font-weight: 700; text-anchor: middle; filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4)); }
    .gauge-bg { fill: none; stroke: #1e3a5f; stroke-width: 20; stroke-linecap: round; }
    .gauge-val { fill: none; stroke: url(#gaugeGrad); stroke-width: 20; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5)); stroke-dasharray: 628; stroke-dashoffset: 6.28; }
    .tick { stroke: #8892b0; stroke-width: 2; }
  </style>

  <defs>
    <!-- Multi color gradient for arc -->
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#64ffda"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="#0a1628"/>

  <g transform="translate(240, 280)">
    <!-- Outer Glow -->
    <path d="M -180 0 A 180 180 0 0 1 180 0" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2" filter="drop-shadow(0 0 20px rgba(0,212,255,0.3))"/>
    
    <!-- Background Arc r=150 (Length = pi * 150 = 471) -->
    <!-- Circumference of full circle = 2*pi*200 = 1256. Half is 628 -->
    <!-- We'll use path for exact semi-circle -->
    <path d="M -150 0 A 150 150 0 0 1 150 0" class="gauge-bg"/>
    
    <!-- Value Arc (99%) path total length = 471. 99% of 471 = ~466 -->
    <path d="M -150 0 A 150 150 0 0 1 150 0" class="gauge-val" stroke-dasharray="471" stroke-dashoffset="4.71"/>

    <!-- Ticks -->
    <!-- 0% --> <line x1="-130" y1="0" x2="-120" y2="0" class="tick"/>
    <!-- 25% --> <line x1="-92" y1="-92" x2="-85" y2="-85" class="tick"/>
    <!-- 50% --> <line x1="0" y1="-130" x2="0" y2="-120" class="tick"/>
    <!-- 75% --> <line x1="92" y1="-92" x2="85" y2="-85" class="tick"/>
    <!-- 100% --> <line x1="130" y1="0" x2="120" y2="0" class="tick"/>

    <!-- Needle (Pointing to 99%, almost 180 degrees) -->
    <g transform="rotate(178)">
      <polygon points="-5,0 5,0 0,-140" fill="#ef476f"/>
      <circle cx="0" cy="0" r="10" fill="#112240" stroke="#ef476f" stroke-width="2"/>
    </g>

    <!-- Content -->
    <text x="0" y="-30" class="number">99%</text>
  </g>

  <text x="240" y="340" class="title">Client Satisfaction Rate</text>
  <text x="240" y="370" class="note">Based on 30+ client projects</text>
</svg>
