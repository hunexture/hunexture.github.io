<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#64ffda" />
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00d4ff" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Subtle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.15" />

  <!-- Center Logo Mark: H + X -->
  <g filter="url(#glow)">
    <!-- Left Pillar of H -->
    <rect x="150" y="128" width="48" height="256" rx="24" fill="url(#brandGrad)" />
    
    <!-- Right Pillar of H -->
    <rect x="314" y="128" width="48" height="256" rx="24" fill="url(#brandGrad)" />
    
    <!-- Diagonal 1 of X -->
    <line x1="174" y1="192" x2="338" y2="320" stroke="#64ffda" stroke-width="40" stroke-linecap="round" />
    
    <!-- Diagonal 2 of X -->
    <line x1="174" y1="320" x2="338" y2="192" stroke="#00d4ff" stroke-width="40" stroke-linecap="round" />
    
    <!-- Center connection dot -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.9" />
    <circle cx="256" cy="256" r="16" fill="#64ffda" />
  </g>
</svg>
