<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@500;600&amp;display=swap');
    .badge-bg { fill: #112240; stroke-width: 1.5; rx: 8; ry: 8; }
    .title { font-family: 'Orbitron', sans-serif; font-size: 14px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <rect width="800" height="320" fill="#0a1628"/>

  <!-- Faint horizontal lines -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Badge 1: AWS -->
  <g transform="translate(60, 110)">
    <rect width="120" height="120" class="badge-bg" stroke="#ff9f1c" opacity="0.8"/>
    <path d="M 60 20 L 80 40 L 40 40 Z" fill="#ff9f1c"/>
    <path d="M 60 60 Q 80 70 40 70" fill="none" stroke="#ff9f1c" stroke-width="3"/>
    <text x="60" y="85" class="title">AWS</text>
    <text x="60" y="105" class="subtitle" fill="#ff9f1c">Certified Partner</text>
  </g>

  <!-- Badge 2: Google Cloud -->
  <g transform="translate(200, 110)">
    <rect width="120" height="120" class="badge-bg" stroke="#0080ff" opacity="0.8"/>
    <polygon points="60,20 80,50 40,50" fill="none" stroke="#0080ff" stroke-width="5"/>
    <line x1="60" y1="35" x2="60" y2="50" stroke="#0080ff" stroke-width="5"/>
    <text x="60" y="85" class="title">Google Cloud</text>
    <text x="60" y="105" class="subtitle" fill="#0080ff">Partner</text>
  </g>

  <!-- Badge 3: React Ecosystem -->
  <g transform="translate(340, 110)">
    <rect width="120" height="120" class="badge-bg" stroke="#00d4ff" filter="drop-shadow(0 0 10px rgba(0,212,255,0.4))"/>
    <ellipse cx="60" cy="35" rx="20" ry="8" fill="none" stroke="#00d4ff" stroke-width="3" transform="rotate(30 60 35)"/>
    <ellipse cx="60" cy="35" rx="20" ry="8" fill="none" stroke="#00d4ff" stroke-width="3" transform="rotate(150 60 35)"/>
    <ellipse cx="60" cy="35" rx="20" ry="8" fill="none" stroke="#00d4ff" stroke-width="3"/>
    <circle cx="60" cy="35" r="3" fill="#00d4ff"/>
    <text x="60" y="85" class="title">React</text>
    <text x="60" y="105" class="subtitle" fill="#00d4ff">Enterprise Dev</text>
  </g>

  <!-- Badge 4: ISO 9001 -->
  <g transform="translate(480, 110)">
    <rect width="120" height="120" class="badge-bg" stroke="#f4d03f" opacity="0.8"/>
    <circle cx="60" cy="35" r="18" fill="none" stroke="#f4d03f" stroke-width="3"/>
    <path d="M 52 35 L 58 41 L 68 28" fill="none" stroke="#f4d03f" stroke-width="3"/>
    <text x="60" y="85" class="title">ISO 9001</text>
    <text x="60" y="105" class="subtitle" fill="#f4d03f">Certified</text>
  </g>

  <!-- Badge 5: OpenAI -->
  <g transform="translate(620, 110)">
    <rect width="120" height="120" class="badge-bg" stroke="#64ffda" opacity="0.8"/>
    <!-- Abstract OpenAI flower logo -->
    <circle cx="60" cy="35" r="16" fill="none" stroke="#64ffda" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="60" cy="35" r="6" fill="#64ffda"/>
    <text x="60" y="85" class="title">OpenAI</text>
    <text x="60" y="105" class="subtitle" fill="#64ffda">Integration</text>
  </g>

</svg>
