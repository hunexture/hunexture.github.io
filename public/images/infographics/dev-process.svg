<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 28px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; fill: #e6f1ff; font-weight: 600; text-anchor: middle; }
    .number { font-family: 'Orbitron', sans-serif; font-size: 22px; fill: #00d4ff; font-weight: 700; text-anchor: middle; }
    .arrow { stroke: url(#arrowGrad); stroke-width: 4; fill: none; stroke-linecap: round; }
    .hex { fill: #112240; stroke: #00d4ff; stroke-width: 2; filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.4)); }
    .bg-circle { fill: none; stroke: #1e3a5f; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#0080ff" />
    </marker>
  </defs>

  <rect width="800" height="800" fill="#0a1628"/>

  <circle cx="400" cy="400" r="320" class="bg-circle" />
  <circle cx="400" cy="400" r="260" class="bg-circle" />
  <circle cx="400" cy="400" r="140" class="bg-circle" />

  <circle cx="400" cy="400" r="80" fill="#112240" stroke="#00d4ff" stroke-width="1"/>
  <text x="400" y="395" class="number" style="fill:#ffffff; font-size:18px">Hunexture</text>
  <text x="400" y="420" class="title" style="font-size:16px;">Process</text>

  <!-- Connectors Radius=260 -->
  <path d="M 445 146 A 260 260 0 0 1 600 200" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 646 270 A 260 260 0 0 1 580 570" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 500 640 A 260 260 0 0 1 290 640" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 215 570 A 260 260 0 0 1 150 270" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 195 200 A 260 260 0 0 1 345 146" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Nodes -->
  <g transform="translate(400, 140)">
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28" class="hex"/>
    <text x="0" y="-10" class="number">1</text>
    <text x="0" y="15" class="label">Discover</text>
  </g>

  <g transform="translate(647, 220)">
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28" class="hex"/>
    <text x="0" y="-10" class="number">2</text>
    <text x="0" y="15" class="label">Design</text>
  </g>

  <g transform="translate(553, 610)">
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28" class="hex"/>
    <text x="0" y="-10" class="number">3</text>
    <text x="0" y="15" class="label">Develop</text>
  </g>

  <g transform="translate(247, 610)">
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28" class="hex"/>
    <text x="0" y="-10" class="number">4</text>
    <text x="0" y="15" class="label">Deploy</text>
  </g>

  <g transform="translate(153, 220)">
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28" class="hex"/>
    <text x="0" y="-10" class="number">5</text>
    <text x="0" y="15" class="label">Scale</text>
  </g>

</svg>
