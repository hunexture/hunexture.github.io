<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 24px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .layer-title { font-family: 'Orbitron', sans-serif; font-size: 16px; fill: #e6f1ff; font-weight: 600; text-anchor: start; }
    .block-text { font-family: 'Inter', sans-serif; font-size: 12px; fill: #e6f1ff; font-weight: 500; text-anchor: middle; }
    .layer-bg { rx: 8; ry: 8; stroke: rgba(0, 212, 255, 0.2); stroke-width: 1; }
    .arrow { stroke: #0080ff; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
  </style>

  <defs>
    <marker id="arrUp" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 10, 5 0, 10 10" fill="#0080ff" />
    </marker>
    <marker id="arrDn" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 5 10, 10 0" fill="#0080ff" />
    </marker>
  </defs>

  <rect width="820" height="520" fill="#0a1628"/>
  <text x="410" y="40" class="title">Cloud Architecture</text>

  <!-- L4: User Interface (Top) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="700" height="70" class="layer-bg" fill="#002447" stroke="#00d4ff" style="filter: drop-shadow(0 0 10px rgba(0,212,255,0.3));"/>
    <text x="20" y="40" class="layer-title">Layer 4: Access</text>
    <rect x="220" y="15" width="120" height="40" rx="4" fill="#004e89"/>
    <text x="280" y="40" class="block-text">Web Apps</text>
    <rect x="360" y="15" width="120" height="40" rx="4" fill="#004e89"/>
    <text x="420" y="40" class="block-text">Mobile Apps</text>
    <rect x="500" y="15" width="120" height="40" rx="4" fill="#004e89"/>
    <text x="560" y="40" class="block-text">B2B Portals</text>
  </g>

  <!-- Connector -->
  <line x1="410" y1="160" x2="410" y2="190" class="arrow" marker-end="url(#arrUp)" marker-start="url(#arrDn)"/>
  <line x1="320" y1="160" x2="320" y2="190" class="arrow" marker-end="url(#arrUp)"/>
  <line x1="500" y1="160" x2="500" y2="190" class="arrow" marker-end="url(#arrUp)"/>

  <!-- L3: Application Layer -->
  <g transform="translate(60, 190)">
    <rect x="0" y="0" width="700" height="90" class="layer-bg" fill="#0f1b29"/>
    <text x="20" y="50" class="layer-title">Layer 3: Application</text>
    <rect x="220" y="25" width="200" height="40" rx="4" fill="#1e3a5f"/>
    <text x="320" y="50" class="block-text">Microservices / APIs</text>
    <rect x="440" y="25" width="200" height="40" rx="4" fill="#1e3a5f"/>
    <text x="540" y="50" class="block-text">Serverless Functions</text>
  </g>

  <!-- Connector -->
  <line x1="410" y1="280" x2="410" y2="310" class="arrow" marker-end="url(#arrUp)" marker-start="url(#arrDn)"/>

  <!-- L2: Platform Services -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="700" height="80" class="layer-bg" fill="#112240"/>
    <text x="20" y="45" class="layer-title">Layer 2: Platform</text>
    <rect x="220" y="20" width="140" height="40" rx="4" fill="#284b72"/>
    <text x="290" y="45" class="block-text">Kubernetes / EKS</text>
    <rect x="380" y="20" width="120" height="40" rx="4" fill="#284b72"/>
    <text x="440" y="45" class="block-text">Docker</text>
    <rect x="520" y="20" width="120" height="40" rx="4" fill="#284b72"/>
    <text x="580" y="45" class="block-text">CI/CD Pipeline</text>
  </g>

  <!-- Connector -->
  <line x1="410" y1="390" x2="410" y2="420" class="arrow" marker-end="url(#arrUp)" marker-start="url(#arrDn)"/>

  <!-- L1: Infrastructure -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="700" height="70" class="layer-bg" fill="#0a1628" stroke="#1e3a5f" stroke-width="2"/>
    <text x="20" y="40" class="layer-title">Layer 1: Infrastructure</text>
    <rect x="220" y="15" width="120" height="40" rx="4" fill="#112240" stroke="#334155"/>
    <text x="280" y="40" class="block-text">Compute (EC2)</text>
    <rect x="360" y="15" width="120" height="40" rx="4" fill="#112240" stroke="#334155"/>
    <text x="420" y="40" class="block-text">Database (RDS)</text>
    <rect x="500" y="15" width="120" height="40" rx="4" fill="#112240" stroke="#334155"/>
    <text x="560" y="40" class="block-text">Storage (S3)</text>
  </g>

</svg>
