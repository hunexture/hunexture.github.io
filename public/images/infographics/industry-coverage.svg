<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 24px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .card-title { font-family: 'Inter', sans-serif; font-size: 16px; fill: #e6f1ff; font-weight: 600; }
    .card-tag { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8892b0; font-weight: 400; }
    .card-bg { fill: #112240; rx: 8; ry: 8; stroke: rgba(0,212,255,0.1); stroke-width: 1; }
    .pattern-line { stroke: rgba(0,212,255,0.03); stroke-width: 1; }
  </style>

  <rect width="800" height="500" fill="#0a1628"/>

  <!-- Background Lines -->
  <pattern id="diagonalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" class="pattern-line"/>
  </pattern>
  <rect width="800" height="500" fill="url(#diagonalGrid)"/>

  <text x="400" y="40" class="title">Industries We Serve</text>

  <!-- Healthcare -->
  <g transform="translate(60, 90)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#ef476f" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#ef476f" opacity="0.1"/>
    <path d="M65 50 L85 50 M75 40 L75 60" stroke="#ef476f" stroke-width="4" stroke-linecap="round"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">Healthcare</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">Telemedicine</text>
  </g>

  <!-- FinTech -->
  <g transform="translate(235, 90)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#00d4ff" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#00d4ff" opacity="0.1"/>
    <path d="M70 42 A 8 8 0 1 1 70 58 A 8 8 0 1 1 70 42 M75 35 L75 65" stroke="#00d4ff" stroke-width="2" fill="none"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">FinTech</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">Blockchain</text>
  </g>

  <!-- E-Commerce -->
  <g transform="translate(410, 90)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#ff9f1c" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#ff9f1c" opacity="0.1"/>
    <path d="M60 40 L90 40 L85 55 L65 55 Z" stroke="#ff9f1c" stroke-width="2" fill="none"/>
    <circle cx="68" cy="62" r="3" fill="#ff9f1c"/>
    <circle cx="82" cy="62" r="3" fill="#ff9f1c"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">E-Commerce</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">Retail Platforms</text>
  </g>

  <!-- Logistics -->
  <g transform="translate(585, 90)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#118ab2" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#118ab2" opacity="0.1"/>
    <rect x="60" y="40" width="20" height="15" stroke="#118ab2" fill="none" stroke-width="2"/>
    <rect x="80" y="45" width="10" height="10" stroke="#118ab2" fill="none" stroke-width="2"/>
    <circle cx="65" cy="60" r="3" fill="#118ab2"/>
    <circle cx="85" cy="60" r="3" fill="#118ab2"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">Logistics</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">Supply Chain</text>
  </g>

  <!-- Education -->
  <g transform="translate(60, 280)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#9d4edd" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#9d4edd" opacity="0.1"/>
    <path d="M60 45 L75 35 L90 45 L75 55 Z" stroke="#9d4edd" fill="none" stroke-width="2"/>
    <path d="M65 50 L65 60 M90 45 L90 60" stroke="#9d4edd" stroke-width="2"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">Education</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">EdTech Apps</text>
  </g>

  <!-- Legal -->
  <g transform="translate(235, 280)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#64ffda" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#64ffda" opacity="0.1"/>
    <path d="M75 35 L75 65 M60 45 L90 45" stroke="#64ffda" stroke-width="2"/>
    <polygon points="60,45 65,55 55,55" stroke="#64ffda" fill="none"/>
    <polygon points="90,45 95,55 85,55" stroke="#64ffda" fill="none"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">LegalTech</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">Compliance</text>
  </g>

  <!-- Manufacturing -->
  <g transform="translate(410, 280)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#0080ff" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#0080ff" opacity="0.1"/>
    <path d="M65 40 L65 60 L85 60 L85 45 L75 45 L75 40 Z" stroke="#0080ff" fill="none" stroke-width="2"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">Manufacturing</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">IoT &amp; ERP</text>
  </g>

  <!-- Media -->
  <g transform="translate(585, 280)">
    <rect width="150" height="170" class="card-bg"/>
    <rect x="0" y="0" width="150" height="4" fill="#ff006e" rx="2"/>
    <circle cx="75" cy="50" r="24" fill="#ff006e" opacity="0.1"/>
    <rect x="60" y="40" width="30" height="20" rx="2" stroke="#ff006e" fill="none" stroke-width="2"/>
    <polygon points="70,45 70,55 80,50" stroke="#ff006e" fill="none" stroke-width="2"/>
    <text x="75" y="110" class="card-title" text-anchor="middle">Media</text>
    <text x="75" y="135" class="card-tag" text-anchor="middle">Streaming</text>
  </g>
</svg>
