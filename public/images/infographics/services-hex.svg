<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" width="750" height="520">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 13px; fill: #ffffff; font-weight: 600; text-anchor: middle; letter-spacing: 0.5px; }
    .center-title { font-family: 'Orbitron', sans-serif; font-size: 16px; fill: #00d4ff; font-weight: 700; text-anchor: middle; filter: drop-shadow(0 0 4px #00d4ff); }
    .hex { fill: #112240; stroke-width: 2; }
    <!-- Hex path radius R=90 => width=156, height=180 -->
    .conn { stroke: rgba(255,255,255,0.05); stroke-width: 2; }

    .glow-0 { stroke: #00d4ff; filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.6)); }
    .glow-1 { stroke: #0080ff; filter: drop-shadow(0 0 8px rgba(0, 128, 255, 0.4)); }
    .glow-2 { stroke: #64ffda; filter: drop-shadow(0 0 8px rgba(100, 255, 218, 0.4)); }
    .glow-3 { stroke: #9d4edd; filter: drop-shadow(0 0 8px rgba(157, 78, 221, 0.4)); }
    .glow-4 { stroke: #ff9f1c; filter: drop-shadow(0 0 8px rgba(255, 159, 28, 0.4)); }
    .glow-5 { stroke: #ef476f; filter: drop-shadow(0 0 8px rgba(239, 71, 111, 0.4)); }
    .glow-6 { stroke: #118ab2; filter: drop-shadow(0 0 8px rgba(17, 138, 178, 0.4)); }
  </style>

  <rect width="750" height="520" fill="#0a1628"/>

  <!-- Center coordinates X=375, Y=260 -->
  <!-- R = 90. Hex width = 155.8, Hex height = 180 -->
  <!-- Centers of surrounding hexes (distance = 156 horizontally, 135+90 vertically) -->
  <!-- Simplified spacing: dx = 165, dy = 100 -->

  <g id="layer-connections">
    <line x1="375" y1="260" x2="375" y2="70" class="conn"/>
    <line x1="375" y1="260" x2="535" y2="165" class="conn"/>
    <line x1="375" y1="260" x2="535" y2="355" class="conn"/>
    <line x1="375" y1="260" x2="375" y2="450" class="conn"/>
    <line x1="375" y1="260" x2="215" y2="355" class="conn"/>
    <line x1="375" y1="260" x2="215" y2="165" class="conn"/>
  </g>

  <!-- Definition of a vertical hexagon -->
  <defs>
    <polygon id="hexShape" points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"/>
  </defs>

  <!-- Hex 1: Top (Web Dev) -->
  <g transform="translate(375, 70)">
    <use href="#hexShape" class="hex glow-1"/>
    <!-- Icon -->
    <rect x="-16" y="-26" width="32" height="24" rx="2" stroke="#0080ff" fill="none" stroke-width="2"/>
    <line x1="-8" y1="4" x2="8" y2="4" stroke="#0080ff" stroke-width="2"/>
    <text x="0" y="25" class="title">Web</text>
    <text x="0" y="42" class="title">Development</text>
  </g>

  <!-- Hex 2: Top Right (App Dev) -->
  <g transform="translate(535, 165)">
    <use href="#hexShape" class="hex glow-2"/>
    <rect x="-10" y="-30" width="20" height="34" rx="4" stroke="#64ffda" fill="none" stroke-width="2"/>
    <circle cx="0" cy="0" r="1.5" fill="#64ffda"/>
    <text x="0" y="25" class="title">App</text>
    <text x="0" y="42" class="title">Development</text>
  </g>

  <!-- Hex 3: Bottom Right (Cloud) -->
  <g transform="translate(535, 355)">
    <use href="#hexShape" class="hex glow-3"/>
    <path d="M-10 -15 Q -10 -25 0 -25 Q 12 -25 12 -15 Q 18 -15 18 -8" stroke="#9d4edd" fill="none" stroke-width="2"/>
    <path d="M-10 -15 Q -18 -15 -18 -8 Q -18 0 0 0 Q 18 0 18 -8" stroke="#9d4edd" fill="none" stroke-width="2"/>
    <text x="0" y="25" class="title">Cloud</text>
    <text x="0" y="42" class="title">Services</text>
  </g>

  <!-- Hex 4: Bottom (Design) -->
  <g transform="translate(375, 450)">
    <use href="#hexShape" class="hex glow-4"/>
    <path d="M-8 -25 L8 -25 L16 -10 L0 5 L-16 -10 Z" stroke="#ff9f1c" fill="none" stroke-width="2"/>
    <text x="0" y="25" class="title">UI/UX</text>
    <text x="0" y="42" class="title">Design</text>
  </g>

  <!-- Hex 5: Bottom Left (Digital Marketing) -->
  <g transform="translate(215, 355)">
    <use href="#hexShape" class="hex glow-5"/>
    <path d="M-16 -5 L-5 -15 L5 -5 L16 -20" stroke="#ef476f" fill="none" stroke-width="2"/>
    <polyline points="10,-20 16,-20 16,-14" stroke="#ef476f" fill="none" stroke-width="2"/>
    <text x="0" y="25" class="title">Digital</text>
    <text x="0" y="42" class="title">Marketing</text>
  </g>

  <!-- Hex 6: Top Left (AI) -->
  <g transform="translate(215, 165)">
    <use href="#hexShape" class="hex glow-6"/>
    <circle cx="0" cy="-15" r="10" stroke="#118ab2" fill="none" stroke-width="2"/>
    <path d="M0 -5 L0 5 M-10 -15 L-16 -15 M10 -15 L16 -15" stroke="#118ab2" stroke-width="2"/>
    <text x="0" y="25" class="title">AI</text>
    <text x="0" y="42" class="title">Solutions</text>
  </g>

  <!-- Center Hex: Hunexture -->
  <g transform="translate(375, 260)">
    <use href="#hexShape" class="hex glow-0"/>
    <path d="M-20 -15 L-20 15 M-20 0 L0 0 M0 -15 L0 15 M10 -15 L20 15 M20 -15 L10 15" stroke="#00d4ff" fill="none" stroke-width="3" opacity="0.8"/>
    <text x="0" y="35" class="center-title">Hunexture</text>
  </g>

</svg>
