<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Inter:wght@500;600&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 22px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .layer-text { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .badge-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #00d4ff; font-weight: 600; text-anchor: middle; }
    .badge-bg { fill: #112240; rx: 12; stroke: #00d4ff; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.4)); }
  </style>

  <rect width="640" height="480" fill="#0a1628"/>
  <text x="320" y="40" class="title">Enterprise Security Architecture</text>

  <!-- Concentric Shields (Using precise path M) Center is (320, 260) -->
  <g transform="translate(320, 260)">
    
    <!-- Shield 1 (Network) -->
    <path d="M 0 -180 L 160 -150 L 160 20 Q 160 150 0 200 Q -160 150 -160 20 L -160 -150 Z" 
          fill="#0a1628" stroke="#334155" stroke-width="3"/>
    <text x="0" y="-155" class="layer-text" fill="#8892b0">Network Security</text>

    <!-- Shield 2 (Application) -->
    <path d="M 0 -130 L 120 -110 L 120 10 Q 120 110 0 150 Q -120 110 -120 10 L -120 -110 Z" 
          fill="#112240" stroke="#1e3a5f" stroke-width="3"/>
    <text x="0" y="-110" class="layer-text" fill="#8892b0">Application Security</text>

    <!-- Shield 3 (Data Encryption) -->
    <path d="M 0 -85 L 85 -70 L 85 5 Q 85 75 0 105 Q -85 75 -85 5 L -85 -70 Z" 
          fill="#1a3154" stroke="#004e89" stroke-width="3"/>
    <text x="0" y="-70" class="layer-text" fill="#0080ff">Data Encryption</text>

    <!-- Shield 4 (Access Control) -->
    <path d="M 0 -45 L 55 -38 L 55 5 Q 55 45 0 65 Q -55 45 -55 5 L -55 -38 Z" 
          fill="#004e89" stroke="#0080ff" stroke-width="3"/>
    <text x="0" y="-35" class="layer-text" fill="#ffffff" font-size="11">Access</text>

    <!-- Shield 5 (Zero Trust Core) -->
    <path d="M 0 -12 L 25 -10 L 25 5 Q 25 25 0 35 Q -25 25 -25 5 L -25 -10 Z" 
          fill="#00d4ff" stroke="#ffffff" stroke-width="2" style="filter: drop-shadow(0 0 15px rgba(0,212,255,0.8));"/>
  </g>

  <!-- Badges -->
  <g transform="translate(80, 100)">
    <rect width="80" height="24" class="badge-bg"/>
    <text x="40" y="16" class="badge-text" fill="#ffffff">HIPAA</text>
  </g>
  <g transform="translate(480, 100)">
    <rect width="80" height="24" class="badge-bg"/>
    <text x="40" y="16" class="badge-text" fill="#ffffff">GDPR</text>
  </g>
  <g transform="translate(60, 360)">
    <rect width="100" height="24" class="badge-bg"/>
    <text x="50" y="16" class="badge-text" fill="#ffffff">ISO 27001</text>
  </g>
  <g transform="translate(480, 360)">
    <rect width="80" height="24" class="badge-bg"/>
    <text x="40" y="16" class="badge-text" fill="#ffffff">SOC 2</text>
  </g>
</svg>
