<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 22px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .stage-label { font-family: 'Inter', sans-serif; font-size: 14px; fill: #e6f1ff; font-weight: 600; text-anchor: end; }
    .stage-num { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; text-anchor: start; }
    .funnel-layer { stroke: #1e3a5f; stroke-width: 2; }
  </style>

  <rect width="500" height="560" fill="#0a1628"/>
  <text x="250" y="40" class="title">From Problem to Solution</text>

  <!-- Connectors from label to funnel -->
  <line x1="100" y1="120" x2="250" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="200" x2="250" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="280" x2="250" y2="280" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="160" y1="360" x2="250" y2="360" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="180" y1="440" x2="250" y2="440" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Funnel Structure -->
  <!-- Layer 1 -->
  <polygon points="120,80 380,80 360,160 140,160" class="funnel-layer" fill="#112240"/>
  <!-- Layer 2 -->
  <polygon points="140,160 360,160 330,240 170,240" class="funnel-layer" fill="#1a3154"/>
  <!-- Layer 3 -->
  <polygon points="170,240 330,240 300,320 200,320" class="funnel-layer" fill="#004e89"/>
  <!-- Layer 4 -->
  <polygon points="200,320 300,320 280,400 220,400" class="funnel-layer" fill="#0080ff"/>
  <!-- Layer 5 -->
  <polygon points="220,400 280,400 260,480 240,480" class="funnel-layer" fill="#00d4ff" style="filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8));"/>

  <!-- Labels -->
  <text x="110" y="125" class="stage-label">Business Challenge</text>
  <text x="130" y="205" class="stage-label">Data Analysis</text>
  <text x="160" y="285" class="stage-label">AI Strategy</text>
  <text x="190" y="365" class="stage-label">Solution Dev</text>
  <text x="210" y="445" class="stage-label" fill="#00d4ff">Measurable Results</text>

  <!-- Numbers -->
  <text x="390" y="127" class="stage-num" fill="#8892b0">01</text>
  <text x="370" y="207" class="stage-num" fill="#8892b0">02</text>
  <text x="340" y="287" class="stage-num" fill="#8892b0">03</text>
  <text x="310" y="367" class="stage-num" fill="#0080ff">04</text>
  <text x="290" y="447" class="stage-num" fill="#00d4ff">05</text>

  <!-- ROI Starbust -->
  <g transform="translate(250, 520)">
    <circle cx="0" cy="0" r="30" fill="transparent" stroke="#00d4ff" stroke-width="2" style="filter: drop-shadow(0 0 10px #00d4ff);"/>
    <path d="M 0 -40 L 0 40 M -40 0 L 40 0 M -28 -28 L 28 28 M -28 28 L 28 -28" stroke="#00d4ff" stroke-width="3" opacity="0.5"/>
    <text x="0" y="8" font-family="Orbitron" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">ROI</text>
  </g>

</svg>
