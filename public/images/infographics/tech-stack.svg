<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    .title { font-family: 'Orbitron', sans-serif; font-size: 18px; fill: #ffffff; font-weight: 700; }
    .item-text { font-family: 'Inter', sans-serif; font-size: 14px; fill: #8892b0; font-weight: 500; }
    .card { fill: #112240; stroke: rgba(0, 212, 255, 0.2); stroke-width: 1.5; rx: 12; ry: 12; }
    .accent-line { fill: #00d4ff; }
  </style>

  <rect width="800" height="500" fill="#0a1628"/>

  <!-- Card 1: Frontend -->
  <g transform="translate(40, 40)">
    <rect width="220" height="190" class="card"/>
    <rect x="0" y="0" width="220" height="4" class="accent-line" rx="2" ry="2" fill="#00d4ff"/>
    <!-- Icon Placeholder -->
    <rect x="20" y="20" width="32" height="32" rx="6" fill="#00d4ff" opacity="0.1"/>
    <path d="M28 32 L36 24 L44 32" stroke="#00d4ff" fill="none" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 40 L36 48 L44 40" stroke="#00d4ff" fill="none" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="80" class="title">Frontend</text>
    <text x="20" y="110" class="item-text">• React.js</text>
    <text x="20" y="135" class="item-text">• Next.js</text>
    <text x="20" y="160" class="item-text">• TypeScript</text>
  </g>

  <!-- Card 2: Backend -->
  <g transform="translate(290, 40)">
    <rect width="220" height="190" class="card"/>
    <rect x="0" y="0" width="220" height="4" class="accent-line" rx="2" ry="2" fill="#64ffda"/>
    <!-- Icon Placeholder -->
    <rect x="20" y="20" width="32" height="32" rx="6" fill="#64ffda" opacity="0.1"/>
    <circle cx="36" cy="36" r="10" stroke="#64ffda" fill="none" stroke-width="2"/>
    <line x1="36" y1="20" x2="36" y2="26" stroke="#64ffda" stroke-width="2"/>
    <text x="20" y="80" class="title">Backend</text>
    <text x="20" y="110" class="item-text">• Node.js</text>
    <text x="20" y="135" class="item-text">• Python</text>
    <text x="20" y="160" class="item-text">• Django</text>
  </g>

  <!-- Card 3: AI & ML -->
  <g transform="translate(540, 40)">
    <rect width="220" height="190" class="card"/>
    <rect x="0" y="0" width="220" height="4" class="accent-line" rx="2" ry="2" fill="#0080ff"/>
    <!-- Icon Placeholder -->
    <rect x="20" y="20" width="32" height="32" rx="6" fill="#0080ff" opacity="0.1"/>
    <path d="M28 36 L36 26 L44 36" stroke="#0080ff" fill="none" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="36" cy="31" r="2" fill="#0080ff"/>
    <text x="20" y="80" class="title">AI &amp; ML</text>
    <text x="20" y="110" class="item-text">• TensorFlow</text>
    <text x="20" y="135" class="item-text">• PyTorch</text>
    <text x="20" y="160" class="item-text">• LLMs</text>
  </g>

  <!-- Card 4: Cloud -->
  <g transform="translate(40, 270)">
    <rect width="220" height="190" class="card"/>
    <rect x="0" y="0" width="220" height="4" class="accent-line" rx="2" ry="2" fill="#0080ff"/>
    <!-- Icon Placeholder -->
    <rect x="20" y="20" width="32" height="32" rx="6" fill="#0080ff" opacity="0.1"/>
    <path d="M26 36 Q 26 28 32 30 Q 36 24 40 30 Q 46 30 46 36 Z" stroke="#0080ff" fill="none" stroke-width="2"/>
    <text x="20" y="80" class="title">Cloud</text>
    <text x="20" y="110" class="item-text">• AWS</text>
    <text x="20" y="135" class="item-text">• GCP</text>
    <text x="20" y="160" class="item-text">• Azure</text>
  </g>

  <!-- Card 5: Mobile -->
  <g transform="translate(290, 270)">
    <rect width="220" height="190" class="card"/>
    <rect x="0" y="0" width="220" height="4" class="accent-line" rx="2" ry="2" fill="#00d4ff"/>
    <!-- Icon Placeholder -->
    <rect x="20" y="20" width="32" height="32" rx="6" fill="#00d4ff" opacity="0.1"/>
    <rect x="28" y="24" width="16" height="24" rx="2" stroke="#00d4ff" fill="none" stroke-width="2"/>
    <text x="20" y="80" class="title">Mobile</text>
    <text x="20" y="110" class="item-text">• React Native</text>
    <text x="20" y="135" class="item-text">• Flutter</text>
    <text x="20" y="160" class="item-text">• Swift/Kotlin</text>
  </g>

  <!-- Card 6: Database -->
  <g transform="translate(540, 270)">
    <rect width="220" height="190" class="card"/>
    <rect x="0" y="0" width="220" height="4" class="accent-line" rx="2" ry="2" fill="#64ffda"/>
    <!-- Icon Placeholder -->
    <rect x="20" y="20" width="32" height="32" rx="6" fill="#64ffda" opacity="0.1"/>
    <ellipse cx="36" cy="28" rx="8" ry="3" stroke="#64ffda" fill="none" stroke-width="2"/>
    <path d="M28 28 L28 42 A 8 3 0 0 0 44 42 L44 28" stroke="#64ffda" fill="none" stroke-width="2"/>
    <text x="20" y="80" class="title">Database</text>
    <text x="20" y="110" class="item-text">• PostgreSQL</text>
    <text x="20" y="135" class="item-text">• MongoDB</text>
    <text x="20" y="160" class="item-text">• Redis</text>
  </g>

</svg>
