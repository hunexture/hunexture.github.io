<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Inter:wght@500&amp;display=swap');
    .hub { font-family: 'Orbitron', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; text-anchor: middle; filter: drop-shadow(0 0 8px #00d4ff); }
    .node-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #e6f1ff; font-weight: 500; text-anchor: middle; }
    .link { stroke: #0080ff; stroke-width: 1.5; fill: none; opacity: 0.6; }
    .sub-link { stroke: #1e3a5f; stroke-width: 1; fill: none; }
    .hub-circle { fill: #112240; stroke: #00d4ff; stroke-width: 3; }
    .node-circle { fill: #112240; stroke: #00d4ff; stroke-width: 2; opacity: 0.9; }
    .sub-node { fill: #00d4ff; opacity: 0.5; }
    .star { fill: #ffffff; opacity: 0.2; }
  </style>

  <rect width="640" height="640" fill="#0a1628"/>

  <!-- Starfield background -->
  <circle cx="50" cy="100" r="1.5" class="star" />
  <circle cx="150" cy="50" r="1" class="star" />
  <circle cx="550" cy="120" r="2" class="star" opacity="0.4" />
  <circle cx="600" cy="300" r="1.5" class="star" />
  <circle cx="450" cy="550" r="1" class="star" />
  <circle cx="100" cy="500" r="1.5" class="star" />
  <circle cx="200" cy="400" r="1" class="star" />
  <circle cx="350" cy="600" r="2" class="star" opacity="0.3" />
  
  <g transform="translate(320, 320)">
    <!-- Links to Level 1 -->
    <line x1="0" y1="0" x2="0" y2="-120" class="link"/>
    <line x1="0" y1="0" x2="85" y2="-85" class="link"/>
    <line x1="0" y1="0" x2="120" y2="0" class="link"/>
    <line x1="0" y1="0" x2="85" y2="85" class="link"/>
    <line x1="0" y1="0" x2="0" y2="120" class="link"/>
    <line x1="0" y1="0" x2="-85" y2="85" class="link"/>
    <line x1="0" y1="0" x2="-120" y2="0" class="link"/>
    <line x1="0" y1="0" x2="-85" y2="-85" class="link"/>

    <!-- Links to Level 2 (Sub nodes) -->
    <!-- North -->
    <line x1="0" y1="-120" x2="-40" y2="-200" class="sub-link"/>
    <line x1="0" y1="-120" x2="40" y2="-200" class="sub-link"/>
    <!-- NE -->
    <line x1="85" y1="-85" x2="160" y2="-120" class="sub-link"/>
    <line x1="85" y1="-85" x2="120" y2="-160" class="sub-link"/>
    <!-- East -->
    <line x1="120" y1="0" x2="200" y2="-30" class="sub-link"/>
    <line x1="120" y1="0" x2="200" y2="30" class="sub-link"/>
    <!-- SE -->
    <line x1="85" y1="85" x2="160" y2="120" class="sub-link"/>
    <line x1="85" y1="85" x2="120" y2="160" class="sub-link"/>
    <!-- South -->
    <line x1="0" y1="120" x2="-40" y2="200" class="sub-link"/>
    <line x1="0" y1="120" x2="40" y2="200" class="sub-link"/>
    <!-- SW -->
    <line x1="-85" y1="85" x2="-160" y2="120" class="sub-link"/>
    <line x1="-85" y1="85" x2="-120" y2="160" class="sub-link"/>
    <!-- West -->
    <line x1="-120" y1="0" x2="-200" y2="-30" class="sub-link"/>
    <line x1="-120" y1="0" x2="-200" y2="30" class="sub-link"/>
    <!-- NW -->
    <line x1="-85" y1="-85" x2="-160" y2="-120" class="sub-link"/>
    <line x1="-85" y1="-85" x2="-120" y2="-160" class="sub-link"/>

    <!-- Level 2 Sub nodes (Dots) -->
    <circle cx="-40" cy="-200" r="3" class="sub-node"/> <text x="-40" y="-210" font-size="8" fill="#8892b0">Redux</text>
    <circle cx="40" cy="-200" r="3" class="sub-node"/> <text x="40" y="-210" font-size="8" fill="#8892b0">Next.js</text>
    <circle cx="160" cy="-120" r="3" class="sub-node"/> <text x="175" y="-115" font-size="8" fill="#8892b0">Express</text>
    <circle cx="120" cy="-160" r="3" class="sub-node"/> <text x="135" y="-165" font-size="8" fill="#8892b0">NestJS</text>
    <circle cx="200" cy="-30" r="3" class="sub-node"/> <text x="215" y="-25" font-size="8" fill="#8892b0">Django</text>
    <circle cx="200" cy="30" r="3" class="sub-node"/> <text x="215" y="35" font-size="8" fill="#8892b0">FastAPI</text>
    <circle cx="160" cy="120" r="3" class="sub-node"/> <text x="175" y="125" font-size="8" fill="#8892b0">EC2</text>
    <circle cx="120" cy="160" r="3" class="sub-node"/> <text x="135" y="165" font-size="8" fill="#8892b0">S3</text>
    <circle cx="-40" cy="200" r="3" class="sub-node"/> <text x="-40" y="215" font-size="8" fill="#8892b0">PyTorch</text>
    <circle cx="40" cy="200" r="3" class="sub-node"/> <text x="40" y="215" font-size="8" fill="#8892b0">Keras</text>
    <circle cx="-160" cy="120" r="3" class="sub-node"/> <text x="-175" y="125" font-size="8" fill="#8892b0" text-anchor="end">MySQL</text>
    <circle cx="-120" cy="160" r="3" class="sub-node"/> <text x="-135" y="165" font-size="8" fill="#8892b0" text-anchor="end">MongoDB</text>
    <circle cx="-200" cy="-30" r="3" class="sub-node"/> <text x="-215" y="-25" font-size="8" fill="#8892b0" text-anchor="end">Compose</text>
    <circle cx="-200" cy="30" r="3" class="sub-node"/> <text x="-215" y="35" font-size="8" fill="#8892b0" text-anchor="end">Swarm</text>
    <circle cx="-160" cy="-120" r="3" class="sub-node"/> <text x="-175" y="-115" font-size="8" fill="#8892b0" text-anchor="end">EKS</text>
    <circle cx="-120" cy="-160" r="3" class="sub-node"/> <text x="-135" y="-165" font-size="8" fill="#8892b0" text-anchor="end">Helm</text>

    <!-- Level 1 Nodes -->
    <g transform="translate(0, -120)">
      <circle r="30" class="node-circle" style="stroke:#00d4ff"/>
      <text y="4" class="node-text">React</text>
    </g>
    <g transform="translate(85, -85)">
      <circle r="26" class="node-circle" style="stroke:#64ffda"/>
      <text y="4" class="node-text">Node.js</text>
    </g>
    <g transform="translate(120, 0)">
      <circle r="28" class="node-circle" style="stroke:#0080ff"/>
      <text y="4" class="node-text">Python</text>
    </g>
    <g transform="translate(85, 85)">
      <circle r="26" class="node-circle" style="stroke:#ff9f1c"/>
      <text y="4" class="node-text">AWS</text>
    </g>
    <g transform="translate(0, 120)">
      <circle r="32" class="node-circle" style="stroke:#ef476f"/>
      <text y="4" class="node-text">TensorFlow</text>
    </g>
    <g transform="translate(-85, 85)">
      <circle r="28" class="node-circle" style="stroke:#00d4ff"/>
      <text y="4" class="node-text">PostgreSQL</text>
    </g>
    <g transform="translate(-120, 0)">
      <circle r="26" class="node-circle" style="stroke:#64ffda"/>
      <text y="4" class="node-text">Docker</text>
    </g>
    <g transform="translate(-85, -85)">
      <circle r="30" class="node-circle" style="stroke:#0080ff"/>
      <text y="4" class="node-text">Kubernetes</text>
    </g>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="45" class="hub-circle" style="fill:#0a1628;"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="0" y="6" class="hub">Hunexture</text>

  </g>
</svg>
