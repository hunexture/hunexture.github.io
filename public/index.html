    <!-- Loading indicator shown until the app renders -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #F4F6FB; color: #4B5563; font: 14px system-ui, sans-serif; }
      .boot i { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #D9DEEA; border-top-color: #6366F1; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <noscript><style>.boot { display: none; }</style></noscript>
    <!-- Plain page text written into #root by scripts/prerender.js -->
    <style>.prerender { max-width: 760px; margin: 0 auto; padding: 32px 20px; color: #0B1020; font: 16px/1.6 system-ui, sans-serif; }</style>
    <script type="text/javascript">
      // If the app's script or stylesheet fails to load (for example right after
      // a new deploy), reload once, then offer a manual reload.
      window.addEventListener('error', function (e) {
        var t = e.target;
        var url = t && (t.src || t.href);
        if (!url || url.indexOf('/static/') === -1 || !document.querySelector('.boot')) return;
        try {
          var last = Number(sessionStorage.getItem('hunexture-reloaded-at')) || 0;
          if (Date.now() - last > 30000) {
            sessionStorage.setItem('hunexture-reloaded-at', String(Date.now()));
            location.reload();
            return;
          }
        } catch (err) {}
        var msg = document.querySelector('.boot span');
        if (msg) msg.innerHTML = 'The page did not load. <a href="">Reload</a>';
      }, true);
    </script>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
